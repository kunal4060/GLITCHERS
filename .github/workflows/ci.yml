name: CI

# Playbook Layer 7b — fast automated checks on every push/PR.
# Two independent jobs (fail fast): backend (typecheck + jest) and mobile (typecheck).
# Both use the workspace-aware root install: the monorepo has a single root
# package-lock.json and backend/mobile link @glitchers/shared via npm workspaces,
# so `npm ci` must run at the repo root — installing inside backend/ or mobile/
# alone would fail to resolve the workspace package.

on:
  push:
    branches: [nia-redesign, main]
  pull_request:
    branches: [nia-redesign, main]

jobs:
  backend:
    name: Backend — typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.node-version
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Build shared workspace
        # @glitchers/shared ships types via dist/index.d.ts (see its package.json
        # "types" field); backend tsconfig has no paths mapping, so dist must be
        # built before backend typecheck/jest can resolve the workspace package.
        # Same order as backend/Dockerfile ("Build shared first, then backend").
        run: npm run build --workspace=@glitchers/shared

      - name: Typecheck
        run: npm run typecheck --workspace=@glitchers/backend

      - name: Run jest tests
        run: npm test --workspace=@glitchers/backend
        env:
          NODE_ENV: test
          # Dummy values — the backend zod env schema has defaults for
          # everything, tests must not depend on real credentials.
          GEMINI_API_KEY: test-mock-key
          JWT_SECRET: ci-test-secret-key-32-chars-long
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          SUPABASE_ANON_KEY: dummy-anon-key
          GOOGLE_CLIENT_ID: dummy-google-client-id
          GOOGLE_CLIENT_SECRET: dummy-google-client-secret

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=@glitchers/mobile
